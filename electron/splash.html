<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>A-S-G Studio</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #09090b;
      color: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      user-select: none;
      -webkit-user-select: none;
      -webkit-app-region: drag;
      overflow: hidden;
    }
    .logo-container {
      margin-bottom: 20px;
    }
    .logo-img {
      width: 68px;
      height: 68px;
      border-radius: 16px;
      border: 1px solid #27272a;
      background: #121215;
      box-shadow: 0 12px 24px -6px rgba(0, 0, 0, 0.6);
      display: block;
    }
    .title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin-bottom: 4px;
      color: #fafafa;
    }
    .subtitle {
      font-size: 12px;
      color: #71717a;
      margin-bottom: 28px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 600;
    }
    .progress-bar {
      width: 200px;
      height: 3px;
      background-color: #18181c;
      border-radius: 9999px;
      overflow: hidden;
      position: relative;
    }
    .progress-fill {
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, #52525b, #fafafa);
      border-radius: 9999px;
      position: absolute;
      animation: indeterminate 1.4s infinite ease-in-out;
    }
    @keyframes indeterminate {
      0% { left: -40%; width: 30%; }
      50% { left: 30%; width: 50%; }
      100% { left: 100%; width: 30%; }
    }
    .status-text {
      margin-top: 14px;
      font-size: 12px;
      color: #a1a1aa;
      font-weight: 500;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <img src="../web/assets/logo.png" class="logo-img" alt="ASG">
  </div>
  <div class="title">A-S-G Studio</div>
  <div class="subtitle">AI Shorts Generator</div>
  <div class="progress-bar">
    <div class="progress-fill"></div>
  </div>
  <div id="statusText" class="status-text">Starting AI Engine...</div>
</body>
</html>
