<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Shorts Generator</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --text-bright: #f0f6fc;
      --text-muted: #8b949e;
      --accent: #238636;
      --accent-hover: #2ea043;
      --accent-blue: #58a6ff;
      --danger: #f85149;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      line-height: 1.6;
      padding: 32px 16px;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 32px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      font-size: 24px;
      color: var(--text-bright);
      font-weight: 600;
    }

    .status-badge {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 12px;
      background: rgba(46, 160, 67, 0.15);
      color: #3fb950;
      border: 1px solid rgba(46, 160, 67, 0.4);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    @media (max-width: 768px) {
      .grid { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px;
    }

    .card h2 {
      font-size: 16px;
      color: var(--text-bright);
      margin-bottom: 16px;
      font-weight: 600;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      color: var(--text-bright);
      margin-bottom: 6px;
      font-weight: 500;
    }

    input[type="text"], input[type="number"], select {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-bright);
      padding: 8px 12px;
      font-size: 14px;
      outline: none;
    }

    input[type="text"]:focus, select:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 2px rgba(88, 166, 255, 0.2);
    }

    .row {
      display: flex;
      gap: 12px;
    }

    .row .form-group {
      flex: 1;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      cursor: pointer;
    }

    button.btn-primary {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: 1px solid rgba(240, 246, 252, 0.1);
      border-radius: 6px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    button.btn-primary:hover {
      background: var(--accent-hover);
    }

    button.btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .task-status {
      margin-top: 16px;
      padding: 12px;
      border-radius: 6px;
      background: var(--bg);
      border: 1px solid var(--border);
      font-size: 13px;
      display: none;
    }

    .gallery {
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-height: 600px;
      overflow-y: auto;
    }

    .clip-item {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .clip-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .clip-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-bright);
      word-break: break-all;
    }

    video {
      width: 100%;
      max-height: 320px;
      background: #000;
      border-radius: 4px;
    }

    .clip-actions {
      display: flex;
      justify-content: flex-end;
    }

    .btn-download {
      font-size: 12px;
      color: var(--accent-blue);
      text-decoration: none;
      padding: 4px 8px;
      border: 1px solid var(--border);
      border-radius: 4px;
    }

    .btn-download:hover {
      background: rgba(88, 166, 255, 0.1);
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      padding: 32px 0;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>AI Shorts Generator</h1>
        <p style="font-size: 13px; color: var(--text-muted); margin-top: 4px;">Convert long-form media into viral vertical clips</p>
      </div>
      <div id="apiStatus" class="status-badge">API Connected</div>
    </header>

    <div class="grid">
      <!-- Controls -->
      <div class="card">
        <h2>Generate Clips</h2>
        <form id="generateForm">
          <div class="form-group">
            <label for="sourceInput">Video Source (YouTube URL or local path)</label>
            <input type="text" id="sourceInput" placeholder="https://www.youtube.com/watch?v=..." required>
          </div>

          <div class="row">
            <div class="form-group">
              <label for="clipsCount">Number of Clips</label>
              <input type="number" id="clipsCount" value="3" min="1" max="10">
            </div>
            <div class="form-group">
              <label for="ratioSelect">Aspect Ratio</label>
              <select id="ratioSelect">
                <option value="9:16">9:16 (Vertical)</option>
                <option value="1:1">1:1 (Square)</option>
              </select>
            </div>
          </div>

          <div class="row">
            <div class="form-group">
              <label for="styleSelect">Re-framing Style</label>
              <select id="styleSelect">
                <option value="blurred_background">Blurred Background</option>
                <option value="crop_center">Smart Center Crop</option>
              </select>
            </div>
            <div class="form-group">
              <label for="providerSelect">LLM Provider</label>
              <select id="providerSelect">
                <option value="gemini">Google Gemini</option>
                <option value="openai">OpenAI</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label class="checkbox-label">
              <input type="checkbox" id="subtitlesCheck" checked>
              <span>Burn synchronized subtitles onto output</span>
            </label>
          </div>

          <button type="submit" id="submitBtn" class="btn-primary">Generate Shorts</button>
        </form>

        <div id="taskStatus" class="task-status">
          <p id="taskStatusText">Processing video...</p>
        </div>
      </div>

      <!-- Rendered Clips Gallery -->
      <div class="card">
        <h2>Generated Clips</h2>
        <div id="gallery" class="gallery">
          <div class="empty-state">No clips rendered yet. Submit a video to begin.</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById("generateForm");
    const submitBtn = document.getElementById("submitBtn");
    const taskStatus = document.getElementById("taskStatus");
    const taskStatusText = document.getElementById("taskStatusText");
    const gallery = document.getElementById("gallery");

    async function loadExistingClips() {
      try {
        const res = await fetch("/api/clips");
        if (!res.ok) return;
        const data = await res.json();
        renderGallery(data.clips);
      } catch (err) {
        console.error("Failed to load clips:", err);
      }
    }

    function renderGallery(clips) {
      if (!clips || clips.length === 0) {
        gallery.innerHTML = '<div class="empty-state">No clips rendered yet. Submit a video to begin.</div>';
        return;
      }

      gallery.innerHTML = "";
      clips.forEach(clip => {
        const item = document.createElement("div");
        item.className = "clip-item";
        item.innerHTML = `
          <div class="clip-header">
            <div class="clip-title">${clip.name}</div>
          </div>
          <video controls src="${clip.download_url}"></video>
          <div class="clip-actions">
            <a class="btn-download" href="${clip.download_url}" download>Download MP4</a>
          </div>
        `;
        gallery.appendChild(item);
      });
    }

    async function pollTask(taskId) {
      const interval = setInterval(async () => {
        try {
          const res = await fetch(`/api/status/${taskId}`);
          const task = await res.json();

          if (task.status === "completed") {
            clearInterval(interval);
            taskStatusText.textContent = "Completed successfully!";
            taskStatus.style.borderColor = "var(--accent)";
            submitBtn.disabled = false;
            loadExistingClips();
          } else if (task.status === "failed") {
            clearInterval(interval);
            taskStatusText.textContent = "Error: " + (task.error || "Generation failed");
            taskStatus.style.borderColor = "var(--danger)";
            submitBtn.disabled = false;
          } else {
            taskStatusText.textContent = "Status: " + task.status + "... please wait";
          }
        } catch (e) {
          clearInterval(interval);
          taskStatusText.textContent = "Connection lost to server.";
          submitBtn.disabled = false;
        }
      }, 3000);
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      taskStatus.style.display = "block";
      taskStatus.style.borderColor = "var(--border)";
      taskStatusText.textContent = "Queuing generation job...";

      const payload = {
        source: document.getElementById("sourceInput").value.trim(),
        n_clips: parseInt(document.getElementById("clipsCount").value),
        ratio: document.getElementById("ratioSelect").value,
        style: document.getElementById("styleSelect").value,
        provider: document.getElementById("providerSelect").value,
        burn_subtitles: document.getElementById("subtitlesCheck").checked,
      };

      try {
        const res = await fetch("/api/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });

        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.detail || "Request failed");
        }

        const data = await res.json();
        taskStatusText.textContent = "Job queued. Starting transcription and analysis...";
        pollTask(data.task_id);
      } catch (err) {
        taskStatusText.textContent = "Error: " + err.message;
        taskStatus.style.borderColor = "var(--danger)";
        submitBtn.disabled = false;
      }
    });

    loadExistingClips();
  </script>
</body>
</html>
